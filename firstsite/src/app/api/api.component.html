<p>api works!</p>
<div class="row">
  <div class="col-2">
    <button class="btn btn-success" (click)="getuserdata()">
      Get ALL user
    </button>
  </div>
</div>
<div style="color: red">
  <select class="form-select">
    @for (item of customerList; track $index) {
    <option>{{ item.cusId }}</option>
    }
  </select>
  <select class="form-select">
    @for (item of userList; track $index) {
    <option>{{ item.id }}</option>
    }
  </select>
  <div [ngClass]="divBgColor">{{ Myhome }}</div>
  <button (click)="onclickBg()">change color</button>
  <div class="row">
    <div class="col-3" [ngClass]="num1 === num2 ? 'bg-success' : 'bg-primary'">
      <h1>div-1</h1>
    </div>
    <button (click)="onToggle()">toggle</button>
  </div>
  <input type="text" [(ngModel)]="num1" />
  <input type="text" [(ngModel)]="num2" />
  <div></div>
</div>

<table class="table table-bordered">
  <thead class="table-dark">
    <tr>
      <th>userId</th>
      <th>title</th>
      <th>id</th>
    </tr>
  </thead>
  <tbody *ngFor="let item of userList">
    <tr>
      <td>{{ item.id }}</td>
      <td>{{ item.title }}</td>
      <td>{{ item.userId }}</td>
    </tr>
  </tbody>
</table>
