<app-reuse [message]="'new form'"></app-reuse>
<form [formGroup]="studentForm">
  <div class="form-row">
    <div class="form-group col-md-6">
      <label for="inputEmail4">Email</label>
      <input name="Email" formControlName="Email" type="email" class="form-control" id="Email" placeholder="Email">
      <div class="bg-danger">
        @if (studentForm.controls['Email'].touched && studentForm.controls['Email'].errors?.['required']) {
        <span>this is required</span>
        }
        @else if (studentForm.controls['Email'].errors?.['minlength']) {
        <span>Min 4 char required.</span>
        }
      </div>
    </div>
    <div class="form-group col-md-6">
      <label for="inputPassword4">Password</label>                
      <input formControlName="Password" type="password" class="form-control" name="Password" placeholder="Password">
    </div>
  </div>
  
  <div class="form-group">
    <label for="inputAddress">Address</label>
    <input formControlName="Address" type="text" class="form-control" name="Address" placeholder="1234 Main St">
  </div>
  <div class="form-group">
    <label for="inputAddress2">Address 2</label>
    <input formControlName="Address2" type="text" class="form-control" name="inputAddress2"
      placeholder="Apartment, studio, or floor">
  </div>
  <div class="form-row">
    <div class="form-group col-md-6">
      <label for="inputCity">City</label>
      <input formControlName="City" type="text" class="form-control" name="City">
    </div>
    <div class="form-group col-md-4">
      <label for="inputState">State</label>
      <select formControlName="State" name="State" class="form-control">
        <option selected>Choose</option>
        <option>Guj</option>
        <option>Maha</option>
        <option>Goa</option>
      </select>
    </div>
    <div class="form-group col-md-2">
      <label for="inputZip">Zip</label>
      <input formControlName="Zip" type="text" class="form-control" name="Zip">
    </div>
  </div>
  <div class="form-group">
    <div class="form-check">
      <input formControlName="isAccecptTerm" class="form-check-input" type="checkbox" name="isAccecptTerm">
      <label class="form-check-label" for="gridCheck">
        Check me out
      </label>
    </div>
  </div>
  <button (click)="Submit()" type="submit" class="btn btn-primary">submit</button>
</form>
<div>
  {{formsvalue | json}}
</div>
