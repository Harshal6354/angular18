<form #form="ngForm">
    <div class="form-row" >
      <div class="form-group col-md-6">
        <label for="inputEmail4">Email</label>
                <input type="email" #fname="ngModel" [(ngModel)]="stundentObj.Email" class="form-control" name="Email" placeholder="Email" required minlength="3">
        <div class="text-danger">
            @if (fname.touched && fname.errors?.['required']) {
                <span>This is required </span>
              }@else if(fname.errors?.['minlength']) {
                <span>
                    Min 3 Char required
                </span>
            }
        </div> 
        <div>  
          {{fname.errors | json}}
        </div>
    </div>
    </div>
      <div class="form-group col-md-6">
        <label for="inputPassword4">Password</label>
        <input type="password"   [(ngModel)]="stundentObj.Password" class="form-control" name="Password" placeholder="Password">
    </div>
    <div class="form-group">
      <label for="inputAddress">Address</label>
      <input type="text"  [(ngModel)]="stundentObj.Address"  class="form-control" name="Address" placeholder="1234 Main St">
    </div>

    <div class="form-group">
      <label for="inputAddress2">Address 2</label>
      <input type="text"  [(ngModel)]="stundentObj.Address2" class="form-control" name="Address2" placeholder="Apartment, studio, or floor">
    </div>
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="inputCity">City</label>
        <input type="text" [(ngModel)]="stundentObj.City" class="form-control" name="City">
      </div>
      <div class="form-group col-md-4">
        <label for="inputState">State</label>
        <select name="inputState" [(ngModel)]="stundentObj.State" class="form-control">
          <option selected disabled value="">Choose...</option>
          <option>Gujarat</option>
          <option>Delhi</option>
          <option>Goa</option>
          <option>Punjab</option>
        </select>
      </div>
      <div class="form-group col-md-2">
        <label for="inputZip">Zip</label>
        <input type="text" [(ngModel)]="stundentObj.Zip" class="form-control" name="Zip">
      </div>
    </div>
    <div class="form-group">
      <div class="form-check">
        <input class="form-check-input" [(ngModel)]="stundentObj.isAccecptTerm" type="checkbox" name="isAccecptTerm">
        <label class="form-check-label" for="gridCheck">
          Check me out
        </label>
      </div>
    </div>

    {{form.invalid}}

<div>
    <button type="submit"  (click)="Reset()" class="btn btn-dark">Reset</button></div>
  <button type="submit"  (click)="onSubmit()" class="btn btn-primary">Sign in</button>
       <div class="col-4">
          {{formsValue | json}}
       </div>
</form>
<div>
  @for (items of obj1; track $index) {
      <div>{{items.customer}}</div>
    }
</div>
